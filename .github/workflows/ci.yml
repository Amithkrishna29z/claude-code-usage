name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings so lint debt cannot accumulate silently.
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      - uses: Swatinem/rust-cache@v2

      # Unit tests across both crates. Nothing here opens a window, so they run
      # fine without a display server; the GUI itself is only built.
      - name: Test
        run: cargo test --workspace --all-features

      - name: Build app
        run: cargo build --workspace

  build:
    name: Release binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: claude-usage-windows-x86_64
            binary: usage-app.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: claude-usage-macos-aarch64
            binary: usage-app
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: claude-usage-macos-x86_64
            binary: usage-app
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: claude-usage-linux-x86_64
            binary: usage-app
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p usage-app --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  rolling:
    name: Refresh rolling "latest" build
    # Every commit that lands on main — direct or via a merged PR — refreshes a
    # single prerelease so the newest build is always downloadable without a login
    # and without waiting for a version tag.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    # Two pushes to main close together both refresh the same release, and the step
    # below deletes it before recreating it. Run concurrently, the second run's delete
    # lands between the first run's create and its uploads, and those uploads 404
    # against a release that no longer exists. Queue instead of cancelling: whichever
    # run goes last is the one whose build should be left standing.
    concurrency:
      group: rolling-latest
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            file=$(find "$dir" -type f | head -n 1)
            ext=""
            case "$file" in *.exe) ext=".exe" ;; esac
            cp "$file" "release/${name}${ext}"
          done
          ls -l release

      - name: Replace the latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            "Automatic build of \`main\` at commit \`${GITHUB_SHA:0:7}\`." \
            "" \
            "This prerelease is replaced on every push to main, so its contents change over time. For a fixed download, use a tagged release instead." \
            "" \
            "Binaries are unsigned: macOS Gatekeeper blocks them until the quarantine attribute is cleared, and the Linux build needs GTK and libayatana-appindicator installed." \
            > notes.md

          # Delete and recreate so the "latest" tag follows main rather than staying
          # pinned to whichever commit first created it. A missing release is fine.
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest main build" \
            --notes-file notes.md

  release:
    name: Publish release
    # Only for tag pushes, and only once every platform has built.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # One flat, clearly-named file per platform rather than nested directories.
      - name: Package
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            file=$(find "$dir" -type f | head -n 1)
            ext=""
            case "$file" in *.exe) ext=".exe" ;; esac
            cp "$file" "release/${name}${ext}"
          done
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
