[package]
name = "usage-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
chrono = "0.4.45"
eframe = "0.31.1"
egui = "0.31.1"
notify = "8.2.0"
tray-icon = "0.24.2"
usage-core = { version = "0.2.0", path = "../usage-core" }

# The tray on Linux is a GTK appindicator: it needs gtk::init() and a GTK main loop
# on its own thread. Same version tray-icon pulls in, so nothing new is built.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# Forcing the X11/XWayland backend needs winit's own builder extension trait, which
# eframe does not re-export. Same version eframe already pulls in, so nothing new is
# built.
winit = { version = "0.30", default-features = false, features = ["x11"] }
